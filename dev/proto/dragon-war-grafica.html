<title>Dragon War Grafica Nuova</title>

<style>

#tag { position: absolute; top: 10px; left: max(16px, env(safe-area-inset-left, 0px)); font-weight: 700; font-size: 13px; letter-spacing: .04em;
  background: rgba(18,12,34,.6); border: 1px solid var(--edge); border-radius: 999px; padding: 5px 12px; pointer-events: none; }
#bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding-block: 10px;

button { font: 700 15px var(--font); color: var(--ink); background: linear-gradient(#4a3590, #33246a); border: 2px solid #6a52c0; border-bottom-width: 4px;
  border-radius: 12px; padding: 8px 14px; cursor: pointer; }
button:active { transform: translateY(2px); border-bottom-width: 2px; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#bFire { background: linear-gradient(#e0562a, #a82a1e); border-color: var(--hot); }
select { font: 700 15px var(--font); color: var(--ink); background: #33246a; border: 2px solid #6a52c0; border-radius: 12px; padding: 8px 10px; }
#hint { width: 100%; text-align: center; font-weight: 500; font-size: 12px; opacity: .7; }
</style>
<div id="stage"><canvas id="cv"></canvas><div id="tag">Prova grafica · non è il gioco pubblicato</div></div>
<div id="bar">
  <button id="bGob">Goblin</button><button id="bOrc">Orco</button><button id="bStr">Strega</button><button id="bRnd">Cattivo a caso</button><button id="bFire">Fuoco del drago</button>
  <select id="wSel" aria-label="Mondo"></select><button id="bTime">Tramonto</button><button id="bOb">Ostacolo 1</button>
  <div id="hint">Trascina la scena per guardarti intorno</div>
</div>

function beanLeaf(x, y, s, a, c = '#4aa83a') { g.save(); g.translate(x, y); g.rotate(a); g.scale(s, s); V(SP('M0,0 Q8,-10 22,-8 Q16,4 0,0Z'), c, 11, -4, 11, 1.2); L(SP('M2,-1 Q10,-6 20,-7'), dk(c, .3), .9); g.restore(); }

function jLeaf(x, y, s, a, c = '#3f9a3a') { g.save(); g.translate(x, y); g.rotate(a); g.scale(s, s); V(SP('M0,0 Q10,-12 30,-10 Q42,-8 46,0 Q40,6 28,7 Q10,8 0,0Z'), c, 22, -2, 22, 1.2); L(SP('M2,0 Q20,-3 44,0'), dk(c, .3), 1); for (let i = 1; i < 5; i++) L(SP(`M${i * 9},-1 l4,-6 M${i * 9},0 l4,5`), dk(c, .22), .7); g.restore(); }
function palmJ(x, y, s, lean, col = '#3a8a34') {                                  // palma: tronco a anelli che si piega, ciuffo di foglie lunghe, noci di cocco
  const tx = x + lean * s, ty = y - 120 * s; L(SP(`M${x},${y} Q${x + lean * .2 * s},${y - 70 * s} ${tx},${ty}`), '#5a3e24', 9 * s); L(SP(`M${x},${y} Q${x + lean * .2 * s},${y - 70 * s} ${tx},${ty}`), '#8a6a44', 6 * s);
  for (let i = 1; i < 9; i++) { const t = i / 9, px = x + (lean * .2 * 2 * t * (1 - t) + lean * t * t) * s, py = y - (70 * 2 * t * (1 - t) + 120 * t * t) * s; L(SP(`M${px - 3.4 * s},${py} l${6.8 * s},${-1.4 * s}`), '#5a3e24', 1.2 * s); }
  for (const [a, l] of [[-2.9, 1], [-2.3, 1.1], [-1.7, .8], [-1.2, 1.1], [-.5, 1], [.1, .9], [-3.4, .8]]) { const ex = tx + Math.cos(a) * 46 * l * s, ey = ty + Math.sin(a) * 20 * s + 18 * l * s; L(SP(`M${tx},${ty} Q${tx + Math.cos(a) * 26 * l * s},${ty + Math.sin(a) * 30 * s - 6 * s} ${ex},${ey}`), dk(col, .35), 7 * s); L(SP(`M${tx},${ty} Q${tx + Math.cos(a) * 26 * l * s},${ty + Math.sin(a) * 30 * s - 6 * s} ${ex},${ey}`), col, 4.4 * s); }
  for (const [dx, dy] of [[-3, 4], [3, 5], [0, 7]]) V(E(tx + dx * s, ty + dy * s, 3.4 * s, 3.4 * s), '#6a4a2a', tx + dx * s, ty + dy * s, 3 * s, .8 * s); }
function crown(x, y, s, c) { for (const [dx, dy, r] of [[-16, 0, 16], [14, -2, 18], [0, -14, 20], [-6, 6, 14], [10, 8, 14]]) { const p = E(x + dx * s, y + dy * s, r * s, r * s * .86); F(p, c); g.save(); g.clip(p); F(E(x + (dx - r * .3) * s, y + (dy - r * .4) * s, r * .7 * s, r * .5 * s), 'rgba(255,255,200,.16)'); F(E(x + (dx + r * .3) * s, y + (dy + r * .6) * s, r * s, r * .5 * s), 'rgba(0,30,20,.25)'); g.restore(); } }
function jungleTree(x, y, s, c) { V(SP(`M${x - 5 * s},${y} Q${x - 3 * s},${y - 30 * s} ${x - 2 * s},${y - 56 * s} L${x + 3 * s},${y - 56 * s} Q${x + 4 * s},${y - 30 * s} ${x + 6 * s},${y}Z`), '#6a5038', x, y - 28 * s, 12 * s, 1.4 * s); crown(x, y - 64 * s, s * 1.1, c); }
function vineDrop(x, y, len, s = 1, c = '#3a8a34') { L(SP(`M${x},${y} q${4 * s},${len * .5} ${-2 * s},${len}`), dk(c, .3), 2.2 * s); for (let i = 1; i < 6; i++) { const yy = y + len * i / 6, xx = x + Math.sin(i * 1.3) * 2 * s; F(E(xx + (i % 2 ? 3 : -3) * s, yy, 3 * s, 1.6 * s, i % 2 ? .5 : -.5), c); } }
